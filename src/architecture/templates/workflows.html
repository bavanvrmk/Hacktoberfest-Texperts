<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Automator — Workflows</title>
    <style>
        :root { --bg: #090d16; --surface: #111827; --border: #1e293b; --text: #f8fafc; --muted: #94a3b8; --ok: #34d399; --bad: #f87171; --run: #38bdf8; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: Segoe UI, sans-serif; padding: 32px; }
        .wrap { max-width: 1000px; margin: 0 auto; }
        a { color: var(--run); text-decoration: none; }
        h1 { margin: 0 0 8px; }
        .sub { color: var(--muted); margin-bottom: 24px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px; margin-bottom: 14px; }
        .row { display: flex; justify-content: space-between; gap: 16px; align-items: center; }
        .status { font-size: 12px; font-weight: 700; text-transform: uppercase; }
        .ok { color: var(--ok); } .bad { color: var(--bad); } .run { color: var(--run); }
        ol { margin: 12px 0 0; color: #cbd5e1; }
        button { background: #0284c7; color: white; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600; cursor: pointer; }
        .detail { color: var(--muted); font-size: 13px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1>Workflow Manager</h1>
        <p class="sub">Each Spotlight command is saved as steps and can be run again. <a href="/">Back to ROI</a></p>
        <div id="list"></div>
    </div>
    <script>
        function badge(status) {
            const cls = status === "completed" ? "ok" : (status === "failed" ? "bad" : "run");
            return `<span class="status ${cls}">${status}</span>`;
        }
        async function load() {
            const res = await fetch("/api/workflows");
            const data = await res.json();
            const root = document.getElementById("list");
            if (!data.length) {
                root.innerHTML = `<div class="card">No workflows yet. Type a command in the Spotlight bar.</div>`;
                return;
            }
            root.innerHTML = data.map(wf => `
                <div class="card">
                    <div class="row">
                        <div>
                            <strong>#${wf.id} ${wf.command}</strong>
                            <div class="detail">${wf.updated_at || ""}</div>
                        </div>
                        <div class="row">
                            ${badge(wf.status)}
                            <button onclick="runWorkflow(${wf.id})">Run</button>
                        </div>
                    </div>
                    <ol>
                        ${wf.steps.map(step => `<li>${step.action.replaceAll("_", " ")} <strong>${step.target || ""}</strong> — ${step.status}${step.detail ? ` <span class="detail">(${step.detail})</span>` : ""}</li>`).join("")}
                    </ol>
                </div>
            `).join("");
        }
        async function runWorkflow(id) {
            await fetch("/api/workflows/" + id + "/run", { method: "POST" });
            setTimeout(load, 400);
        }
        load();
        setInterval(load, 3000);
    </script>
</body>
</html>
